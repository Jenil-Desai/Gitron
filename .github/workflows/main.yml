name: CI & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Get packages
        run: flutter pub get

      - name: Build Linux release
        run: flutter build linux --release

      - name: Zip Linux build
        run: |
          cd build/linux/x64/release
          zip -r ../../../Gitron-linux.zip bundle/

      - uses: actions/upload-artifact@v4
        with:
          name: Gitron-linux
          path: build/Gitron-linux.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get packages
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Zip Windows build
        run: powershell Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/Gitron-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Gitron-windows
          path: build/Gitron-windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Get packages
        run: flutter pub get

      - name: Build macOS release
        run: flutter build macos --release

      - name: Zip macOS build
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../Gitron-macos.zip *.app

      - uses: actions/upload-artifact@v4
        with:
          name: Gitron-macos
          path: build/Gitron-macos.zip

  create-release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux
        uses: actions/download-artifact@v4
        with:
          name: Gitron-linux
          path: .

      - name: Download Windows
        uses: actions/download-artifact@v4
        with:
          name: Gitron-windows
          path: .

      - name: Download macOS
        uses: actions/download-artifact@v4
        with:
          name: Gitron-macos
          path: .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Gitron-linux.zip
            Gitron-windows.zip
            Gitron-macos.zip
        env:
          GITHUB_TOKEN: ${{ secrets._GITHUB_TOKEN }}
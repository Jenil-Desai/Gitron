name: Build Gitron Desktop Binaries

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2                   # Cross-platform Flutter Action :contentReference[oaicite:2]{index=2}
        with:
          flutter-version: '3.29.3'                        # Bundles Dart 3.7.2 to satisfy flutter_lints :contentReference[oaicite:3]{index=3}
          channel: stable
          architecture: x64

      - name: Cache Flutter pub
        uses: actions/cache@v3                              # Speeds up pub get by caching dependencies :contentReference[oaicite:4]{index=4}
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Enable desktop support
        run: flutter config --enable-linux-desktop --enable-windows-desktop --enable-macos-desktop
        shell: bash

      # ─── Ubuntu-specific system deps ───────────────────────────
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev
        shell: bash                                          # Installs GTK+ and other native tools :contentReference[oaicite:5]{index=5}

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build desktop app
        run: |
          case "${{ matrix.os }}" in
            "ubuntu-latest")  flutter build linux   --release ;;
            "windows-latest") flutter build windows --release ;;
            "macos-latest")   flutter build macos   --release ;;
          esac
        shell: bash                                         # Uses platform-specific Flutter build commands :contentReference[oaicite:6]{index=6}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4                    # Store binaries in Actions UI :contentReference[oaicite:7]{index=7}
        with:
          name: Gitron-${{ matrix.os }}
          path: |
            build/linux/x64/release/bundle/**/*           
            build/windows/runner/Release/**/*              
            build/macos/Build/Products/Release/*.app
          if-no-files-found: error
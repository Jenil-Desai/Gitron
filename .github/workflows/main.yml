name: Build Gitron Desktop Binaries

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Setup Flutter 3.29.3 (includes Dart 3.7.2)
      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2       # Cross-platform Flutter Action :contentReference[oaicite:0]{index=0}
        with:
          flutter-version: '3.29.3'           # Bundles Dart 3.7.2 :contentReference[oaicite:1]{index=1}
          channel: stable
          architecture: x64

      # 3. Cache pub dependencies for faster pub get
      - name: Cache Flutter pub
        uses: actions/cache@v3                # Cache Action to speed up workflows :contentReference[oaicite:2]{index=2}
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: ${{ runner.os }}-pub-

      # 4. Enable desktop platforms
      - name: Enable desktop support
        run: flutter config --enable-linux-desktop --enable-windows-desktop --enable-macos-desktop
        shell: bash                           # Same command across OSes :contentReference[oaicite:3]{index=3}

      # 5. Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # 6. Build per-OS release bundles
      - name: Build desktop app
        run: |
          case "${{ matrix.os }}" in
            "ubuntu-latest")  flutter build linux --release   ;;
            "windows-latest") flutter build windows --release ;;
            "macos-latest")   flutter build macos --release   ;;
          esac
        shell: bash                           # Works on all runners

      # 7. Upload platform-specific artifacts
      - name: Upload build artifact
        uses: actions/upload-artifact@v4     # Collect binaries under Actions → Artifacts :contentReference[oaicite:4]{index=4}
        with:
          name: Gitron-${{ matrix.os }}
          path: |
            build/linux/x64/release/bundle/**/*      
            build/windows/runner/Release/**/*         
            build/macos/Build/Products/Release/*.app
          if-no-files-found: error
name: Build Gitron Desktop App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0' # replace with your Flutter version
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Enable desktop platforms
        run: flutter config --enable-windows-desktop --enable-macos-desktop --enable-linux-desktop

      - name: Build for platform
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            flutter build linux
          elif [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            flutter build windows
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            flutter build macos
          fi
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gitron-${{ matrix.os }}
          path: |
            build/linux/x64/release/bundle/
            build/windows/runner/Release/
            build/macos/Build/Products/Release/Gitron.app
          if-no-files-found: warn

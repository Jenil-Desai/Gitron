name: CI & Release

on:
  push:
    tags:
      - 'v*.*.*'  # e.g., v1.2.3
  workflow_dispatch:

jobs:
  build-desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          architecture: x64

      - name: Enable desktop platforms
        run: flutter config --enable-linux-desktop --enable-windows-desktop --enable-macos-desktop

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter desktop app
        run: |
          case "${{ matrix.os }}" in
            ubuntu-latest)  flutter build linux --release ;;
            windows-latest) flutter build windows --release ;;
            macos-latest)   flutter build macos --release ;;
          esac

      - name: Package build output
        run: |
          mkdir -p dist
          case "${{ matrix.os }}" in
            ubuntu-latest)
              zip -r dist/Gitron-linux.zip build/linux/x64/release/bundle/
              ;;
            windows-latest)
              powershell Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/Gitron-windows.zip
              ;;
            macos-latest)
              zip -r dist/Gitron-macos.zip build/macos/Build/Products/Release/*.app
              ;;
          esac
        shell: bash

      - name: Upload zipped artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gitron-${{ matrix.os }}
          path: dist/

  create-release:
    needs: build-desktop
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets._GITHUB_TOKEN }}

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: Gitron-ubuntu-latest
          path: ./artifacts/linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: Gitron-windows-latest
          path: ./artifacts/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: Gitron-macos-latest
          path: ./artifacts/macos

      - name: Upload Linux to Release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/linux/Gitron-linux.zip
          asset_name: Gitron-linux.zip
          asset_content_type: application/zip

      - name: Upload Windows to Release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/windows/Gitron-windows.zip
          asset_name: Gitron-windows.zip
          asset_content_type: application/zip

      - name: Upload macOS to Release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/macos/Gitron-macos.zip
          asset_name: Gitron-macos.zip
          asset_content_type: application/zip